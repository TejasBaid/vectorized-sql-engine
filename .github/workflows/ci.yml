name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      - run: cargo test --all-targets
      - name: Benchmark smoke test (tiny scale factor)
        run: |
          cargo build --release --bins
          ./target/release/tpchgen --sf 0.01 --out data/sf0.01 --format both
          ./target/release/bench --data data/sf0.01 --format parquet --runs 1
          ./target/release/bench --data data/sf0.01 --format csv --runs 1
          ./target/release/sqlengine --tpch 0.01 -c "EXPLAIN ANALYZE SELECT l_returnflag, count(*) FROM lineitem GROUP BY 1"
